# Dependency updates for the Go module and the workflow actions.
# Security updates are enabled in the repository settings and open their own pull requests.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
