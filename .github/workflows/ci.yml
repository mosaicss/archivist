name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test + lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test (with race + coverage)
        run: go test ./... -race -coverprofile=coverage.out

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

      - name: Install golangci-lint v2
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b $(go env GOPATH)/bin v2.12.2
          golangci-lint --version

      - name: golangci-lint
        run: golangci-lint run

      - name: go build
        run: go build ./cmd/archivist

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck

      - name: shellcheck install.sh
        run: shellcheck scripts/install.sh

      - name: shellcheck ci-drift-check.sh
        run: shellcheck scripts/ci-drift-check.sh

      - name: Install drift-check deps
        run: sudo apt-get install -y grep

      - name: CI drift check (advisory)
        run: |
          # Pass the archivist-cli marketing page from the mosaic repo if it exists.
          # In the CLI repo CI, we don't have access to the mosaic monorepo, so
          # this step is a no-op that always passes (advisory only).
          if [ -f "apps/web/components/marketing/archivist-page.tsx" ]; then
            sh scripts/ci-drift-check.sh apps/web/components/marketing/archivist-page.tsx
          else
            echo "Marketing page not in this repo — drift check skipped (advisory, see Story 36.10)"
          fi
