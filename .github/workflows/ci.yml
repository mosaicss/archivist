name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test + lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test (with race + coverage)
        run: go test ./... -race -coverprofile=coverage.out

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

      - name: Install golangci-lint v2
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b $(go env GOPATH)/bin v2.12.2
          golangci-lint --version

      - name: golangci-lint
        run: golangci-lint run

      - name: go build
        run: go build ./cmd/archivist

      # Regression gate for the skill bundle (39.10 finding: skill/**/* glob
      # silently dropped SKILL.md from v0.2.8–v0.2.12, so /archivist never
      # registered in Claude Code from any install channel). Snapshot-build
      # the archives and assert the bundle ships a discoverable skill.
      - name: Snapshot build (skill bundle gate)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=validate --config goreleaser.yaml

      - name: Verify skill bundle contents
        run: |
          BUNDLE=$(ls dist/archivist_*_skill-bundle.tar.gz)
          tar -tzf "$BUNDLE" | grep -qx "SKILL.md" || { echo "FAIL: SKILL.md missing from skill bundle"; tar -tzf "$BUNDLE"; exit 1; }
          mkdir -p /tmp/skill-check && tar -xzf "$BUNDLE" -C /tmp/skill-check SKILL.md
          head -1 /tmp/skill-check/SKILL.md | grep -qx -- "---" || { echo "FAIL: SKILL.md missing YAML frontmatter (Claude Code discovery)"; exit 1; }
          grep -q "^name: archivist$" /tmp/skill-check/SKILL.md || { echo "FAIL: frontmatter missing name"; exit 1; }
          grep -q "^<!-- version: " /tmp/skill-check/SKILL.md || { echo "FAIL: version marker missing"; exit 1; }
          echo "skill bundle OK: SKILL.md present with frontmatter + version marker"

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck

      - name: shellcheck install.sh
        run: shellcheck scripts/install.sh

      - name: shellcheck ci-drift-check.sh
        run: shellcheck scripts/ci-drift-check.sh

      - name: Install drift-check deps
        run: sudo apt-get install -y grep

      - name: CI drift check (advisory)
        run: |
          # Pass the archivist-cli marketing page from the mosaic repo if it exists.
          # In the CLI repo CI, we don't have access to the mosaic monorepo, so
          # this step is a no-op that always passes (advisory only).
          if [ -f "apps/web/components/marketing/archivist-page.tsx" ]; then
            sh scripts/ci-drift-check.sh apps/web/components/marketing/archivist-page.tsx
          else
            echo "Marketing page not in this repo — drift check skipped (advisory, see Story 36.10)"
          fi
