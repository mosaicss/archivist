name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: goreleaser release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --config goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # TODO(36.11): SLSA build provenance via actions/attest-build-provenance
      # and macOS notarization via Apple Developer secrets. Both deferred to
      # the distribution-channels story where curl|sh + npm + brew actually
      # need signed + provenance-attested artifacts. v0.1.0 ships with
      # SHA256SUMS-only verification; Mac users clear gatekeeper with
      # `xattr -d com.apple.quarantine ~/go/bin/archivist`.
