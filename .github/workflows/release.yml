name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: goreleaser release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Pulled to job-level env so step-level `if:` can read them via
      # ${{ env.X != '' }}. GH Actions rejects `${{ secrets.X != '' }}`
      # in step `if:` conditions ("Unrecognized named-value: 'secrets'").
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      SITEGROUND_DEPLOY_KEY: ${{ secrets.SITEGROUND_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # go.mod's `toolchain` directive wins over its `go` line, so the
          # release builds with exactly the pinned toolchain (go1.27.1).
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Inject version into SKILL.md
        run: |
          VERSION="${{ github.ref_name }}"
          # Target the marker line, NOT line 1 — line 1 is the YAML frontmatter
          # delimiter Claude Code requires for skill discovery. The pre-fix
          # "1s" form clobbered whatever sat on line 1.
          sed -i "s|^<!-- version: .* -->$|<!-- version: ${VERSION} -->|" skill/SKILL.md
          # Fail loud if the marker wasn't found/replaced.
          grep -q "^<!-- version: ${VERSION} -->$" skill/SKILL.md
          # And the frontmatter must have survived intact.
          head -1 skill/SKILL.md | grep -qx -- "---"

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          # --skip=validate bypasses the dirty-git check; the "Inject
          # version into SKILL.md" step deliberately modifies the file
          # in-workflow, which is a trusted modification, not user drift.
          # Homebrew cask publishing is LIVE (Story 39.9): goreleaser pushes
          # Casks/archivist.rb to mosaic-finance-inc/homebrew-tap on every tag,
          # so the repo + HOMEBREW_TAP_GITHUB_TOKEN secret must exist or the
          # release fails. See RELEASE_OPS_36_11.md §4.
          args: release --clean --skip=validate --config goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          APPLE_DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_API_KEY_ISSUER: ${{ secrets.APPLE_API_KEY_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/archivist_v*_*

      - name: Inject SHA256 hashes into npm package
        run: |
          VERSION="${{ github.ref_name }}"
          # Strip leading v for the SUMS file name
          VER="${VERSION#v}"
          SUMS_FILE="dist/archivist_v${VER}_SHA256SUMS"
          if [ ! -f "$SUMS_FILE" ]; then
            echo "SHA256SUMS file not found: $SUMS_FILE"
            exit 1
          fi
          while IFS='  ' read -r hash filename; do
            # Replace placeholder tokens like SHA256_DARWIN_ARM64 with the real hash
            PLACEHOLDER=$(echo "$filename" | sed 's/archivist_v[0-9._]*_//; s/\.\(tar\.gz\|zip\)//' | tr '[:lower:]' '[:upper:]' | tr '-' '_')
            sed -i "s|SHA256_${PLACEHOLDER}|${hash}|g" \
              packages/npm-orchestrator/bin/archivist-install.js
          done < "$SUMS_FILE"
          # Also inject the version into package.json
          sed -i "s/\"version\": \"0.0.0\"/\"version\": \"${VER}\"/" \
            packages/npm-orchestrator/package.json

      - name: Publish npm package
        if: ${{ env.NPM_TOKEN != '' }}
        run: |
          cd packages/npm-orchestrator
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Deploy install.sh to SiteGround
        if: ${{ env.SITEGROUND_DEPLOY_KEY != '' }}
        run: |
          eval "$(ssh-agent -s)"
          echo "${{ secrets.SITEGROUND_DEPLOY_KEY }}" | ssh-add -
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            scripts/install.sh \
            "${{ secrets.SITEGROUND_SSH_USER }}@${{ secrets.SITEGROUND_SSH_HOST }}:${{ secrets.SITEGROUND_INSTALL_PATH }}/install.sh"
