# goreleaser config for the Mosaic Archivist CLI.
#
# Builds 5 platform targets (darwin arm64/amd64, linux arm64/amd64, windows
# amd64) plus the console-less archivistw.exe (windows amd64), produces .tar.gz + .zip archives, emits a single SHA256SUMS file,
# a universal macOS binary, a skill-bundle.tar.gz release asset and SLSA
# provenance attestation (via release.yml). The release workflow does not
# run macOS notarization: its build job holds no APPLE_* secret, so the
# notarize block below stays disabled; a later change adds it in its own job.
#
# release.yml runs `goreleaser release --skip=validate,publish,announce` in a
# read-only build job: goreleaser builds and writes dist/ (archives,
# SHA256SUMS, skill bundle, CHANGELOG.md, homebrew/Casks/archivist.rb) and
# publishes nothing; later jobs sign SHA256SUMS, create the GitHub release
# and push the cask. Builds are reproducible: -trimpath, the commit's
# timestamp and date, and no `go mod tidy` before the build (the workflow
# checks go.mod and go.sum instead).

version: 2

project_name: archivist

builds:
  - id: archivist
    main: ./cmd/archivist
    binary: archivist
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{ slice .CommitDate 0 10 }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  # Story 78.34: the console-less Windows companion. Same main, linked for
  # the GUI subsystem (-H windowsgui) so the logon scheduled task that runs
  # `archivistw.exe connect --service` opens no console or Terminal window.
  - id: archivistw
    main: ./cmd/archivist
    binary: archivistw
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w -H windowsgui
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{ slice .CommitDate 0 10 }}
    mod_timestamp: "{{ .CommitTimestamp }}"

universal_binaries:
  - id: archivist-universal
    ids:
      - archivist
    replace: true

archives:
  - id: archivist
    ids:
      - archivist
      # Include the universal darwin binary too — without this, the macOS
      # archive is missing entirely because `universal_binaries.replace: true`
      # deletes the per-arch darwin binaries.
      - archivist-universal
      # Windows only: the zip holds archivist.exe and archivistw.exe, the
      # other archives one binary, hence allow_different_binary_count.
      - archivistw
    allow_different_binary_count: true
    name_template: "archivist_v{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

  - id: skill-bundle
    meta: true
    name_template: "archivist_v{{ .Version }}_skill-bundle"
    formats:
      - tar.gz
    files:
      # skill/**/* does NOT match direct children of skill/ — it silently
      # dropped SKILL.md from every bundle v0.2.8 through v0.2.12 (found in
      # the 39.10 funnel smoke: /archivist never registered). List the file
      # explicitly; examples/* keeps the historical flat layout.
      # Single-file src: dst is the in-archive PATH (dst: "." would rename
      # the file to "."). Glob src: dst is a directory prefix.
      - src: skill/SKILL.md
        dst: SKILL.md
      - src: skill/examples/*
        dst: .

checksum:
  name_template: "archivist_v{{ .Version }}_SHA256SUMS"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: "^.*?feat(\\(.+\\))??!?:.+$"
      order: 0
    - title: Bug fixes
      regexp: "^.*?fix(\\(.+\\))??!?:.+$"
      order: 1
    - title: Other changes
      order: 999

# macOS notarization, enabled only when APPLE_API_KEY_ID is set. The release
# workflow passes no APPLE_* secret to goreleaser, so it does not run there;
# a later change adds notarization in its own job. See RELEASE_OPS_36_11.md.
notarize:
  macos:
    - enabled: '{{ isEnvSet "APPLE_API_KEY_ID" }}'
      sign:
        certificate: "{{.Env.APPLE_DEVELOPER_ID_CERT_P12_BASE64}}"
        password: "{{.Env.APPLE_DEVELOPER_ID_CERT_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.APPLE_API_KEY_ISSUER}}"
        key_id: "{{.Env.APPLE_API_KEY_ID}}"
        key: "{{.Env.APPLE_API_KEY_P8}}"

# Homebrew cask publishing (migrated from `brews:`, which goreleaser
# deprecated in v2.16; deprecated, not removed: it still runs with a warning,
# and casks are the supported path for prebuilt binaries). Casks land in the
# tap's Casks/ directory
# (the goreleaser default — no `directory:` override). The cask DSL has no
# `test do` block, so the old formula-only test was dropped here.
# goreleaser only writes dist/homebrew/Casks/archivist.rb (publishing is
# skipped); release.yml's publish job pushes it to
# mosaic-finance-inc/homebrew-tap with the HOMEBREW_TAP_GITHUB_TOKEN secret
# (see RELEASE_OPS_36_11.md §4). The token below is read only when
# goreleaser itself publishes, which the workflow never does.
homebrew_casks:
  - name: archivist
    ids:
      - archivist
    repository:
      owner: mosaic-finance-inc
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://mosaic-finance.com/products/archivist-cli"
    description: "Archivist CLI for Mosaic filings research"
    license: "Apache-2.0"
    hooks:
      post:
        install: |
          # Strip the Gatekeeper quarantine flag. Release binaries are
          # unsigned until the operator provisions Apple notarization
          # (RELEASE_OPS_36_11.md section 2). macOS only: Homebrew >= 4.5
          # installs casks with Linux binaries on Linux too, where
          # /usr/bin/xattr does not exist and would abort the install.
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/archivist"]
          end
          # Fetch the matching Claude skill bundle when ~/.claude/skills
          # exists into a private temporary directory, and unpack it only
          # when it matches this release's skill bundle checksum (written
          # into the cask at release time); otherwise skip the skill.
          if File.directory?(File.expand_path("~/.claude/skills"))
            require "digest"
            require "tmpdir"
            skill_sha256 = "{{ sha256 (printf "dist/archivist_v%s_skill-bundle.tar.gz" .Version) }}"
            Dir.mktmpdir("archivist-skill") do |dir|
              bundle = File.join(dir, "skill-bundle.tar.gz")
              fetched = system_command("/usr/bin/curl",
                                       args: ["-fsSL", "--proto", "=https", "--proto-redir", "=https", "-o", bundle,
                                              "https://github.com/mosaicss/archivist/releases/download/v#{version}/archivist_v#{version}_skill-bundle.tar.gz"],
                                       must_succeed: false).success?
              if fetched && File.file?(bundle) && Digest::SHA256.file(bundle).hexdigest == skill_sha256
                skill_dir = File.expand_path("~/.claude/skills/archivist")
                FileUtils.mkdir_p skill_dir
                system_command "/usr/bin/tar", args: ["-xzf", bundle, "-C", skill_dir]
              else
                opoo "The Claude Code skill bundle could not be installed; skipped. Run: archivist update --skill"
              end
            end
          end
          # Stamp the install channel so `archivist update` routes users to
          # `brew upgrade` instead of self-replacing the binary.
          FileUtils.mkdir_p File.expand_path("~/.archivist")
          File.write File.expand_path("~/.archivist/install-channel"), "brew\n"

# Not used by release.yml, which skips publishing and creates the release
# with gh (assets include the installers and SHA256SUMS.sig).
release:
  github:
    owner: mosaicss
    name: archivist
  # Story 78.30: the one-step installers, stamped with the tag by the
  # release workflow's "Stamp installers" step (the release pipe does not run
  # under --snapshot, so CI snapshot builds need no stamped copy).
  extra_files:
    - glob: ./build/installers/install.sh
    - glob: ./build/installers/install.ps1
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
