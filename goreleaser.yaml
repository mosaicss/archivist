# goreleaser config for the Mosaic Archivist CLI.
#
# Builds 5 platform targets (darwin arm64/amd64, linux arm64/amd64, windows
# amd64), produces .tar.gz + .zip archives, emits a single SHA256SUMS file,
# a universal macOS binary, a skill-bundle.tar.gz release asset, SLSA
# provenance attestation (via release.yml), and optional macOS notarization
# (conditional on APPLE_API_KEY_ID being set — see operator checklist).

version: 2

project_name: archivist

before:
  hooks:
    - go mod tidy

builds:
  - id: archivist
    main: ./cmd/archivist
    binary: archivist
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{ time "2006-01-02" }}
    mod_timestamp: "{{ .CommitTimestamp }}"

universal_binaries:
  - id: archivist-universal
    ids:
      - archivist
    replace: true

archives:
  - id: archivist
    ids:
      - archivist
    name_template: "archivist_v{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

  - id: skill-bundle
    meta: true
    name_template: "archivist_v{{ .Version }}_skill-bundle"
    formats:
      - tar.gz
    files:
      - src: skill/**/*
        dst: .

checksum:
  name_template: "archivist_v{{ .Version }}_SHA256SUMS"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: "^.*?feat(\\(.+\\))??!?:.+$"
      order: 0
    - title: Bug fixes
      regexp: "^.*?fix(\\(.+\\))??!?:.+$"
      order: 1
    - title: Other changes
      order: 999

# macOS notarization — conditional on APPLE_API_KEY_ID being set.
# Operator must provision all APPLE_* secrets in the mosaicss/archivist
# repo settings before this takes effect. See RELEASE_OPS_36_11.md.
notarize:
  macos:
    - enabled: '{{ isEnvSet "APPLE_API_KEY_ID" }}'
      sign:
        certificate: "{{.Env.APPLE_DEVELOPER_ID_CERT_P12_BASE64}}"
        password: "{{.Env.APPLE_DEVELOPER_ID_CERT_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.APPLE_API_KEY_ISSUER}}"
        key_id: "{{.Env.APPLE_API_KEY_ID}}"
        key: "{{.Env.APPLE_API_KEY_P8}}"

brews:
  - name: archivist
    # Disabled when HOMEBREW_TAP_GITHUB_TOKEN secret is empty (default —
    # tap repo creation is out-of-scope per RELEASE_OPS_36_11.md). Set the
    # secret to enable. Same conditional shape as `notarize.macos.enabled`.
    disable: '{{ if eq .Env.HOMEBREW_TAP_GITHUB_TOKEN "" }}true{{ end }}'
    ids:
      - archivist
    repository:
      owner: mosaic-finance
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://mosaic-finance.com/products/archivist-cli"
    description: "Archivist CLI for Mosaic filings research"
    license: "Apache-2.0"
    post_install: |
      skill_dir = File.expand_path("~/.claude/skills/archivist")
      if File.directory?(File.expand_path("~/.claude/skills"))
        system "mkdir", "-p", skill_dir
        system "curl", "-fsSL", "-o", "/tmp/archivist-skill.tar.gz",
          "https://github.com/mosaicss/archivist/releases/download/v#{version}/archivist_v#{version}_skill-bundle.tar.gz"
        system "tar", "-xzf", "/tmp/archivist-skill.tar.gz", "-C", skill_dir, "--strip-components=0"
        system "rm", "-f", "/tmp/archivist-skill.tar.gz"
      end
      system "mkdir", "-p", File.expand_path("~/.archivist")
      system "sh", "-c", "echo brew > ~/.archivist/install-channel"
    test: |
      output = shell_output("#{bin}/archivist version")
      assert_match version.to_s, output

release:
  github:
    owner: mosaicss
    name: archivist
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
